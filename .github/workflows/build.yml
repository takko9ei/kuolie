name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # There is deliberately no font installation step. This job exists to
      # prove the promise in the README: a fresh clone compiles with nothing
      # but TeX Live, because the Latin fonts ship in fonts/ and fontset=auto
      # falls back to Fandol, which TeX Live already carries. Expect the
      # "falling back to Fandol" warning in the log -- that is the point.
      #
      # Only main.tex is built. example-cute.tex is a style demo that most
      # people delete when they fork, and a red badge for that would be noise.
      - name: Compile
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          latexmk_use_xelatex: true

      - uses: actions/upload-artifact@v4
        with:
          name: pdf
          path: main.pdf
